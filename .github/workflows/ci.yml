name: AegisSOC CI/CD & Security Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-quality-and-tests:
    name: Backend Pytest, Isolation & Benchmarks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegissoc_user
          POSTGRES_PASSWORD: ci_test_password_not_for_prod
          POSTGRES_DB: aegissoc_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter & Formatter
        working-directory: ./backend
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest Suite Across Phases 1 to 5B
        working-directory: ./backend
        env:
          ENVIRONMENT: testing
          SECRET_KEY: ci-environment-testing-secret-key-32-chars-long
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: aegissoc_user
          POSTGRES_PASSWORD: ci_test_password_not_for_prod
          POSTGRES_DB: aegissoc_db
        run: |
          pytest -v --tb=short

      - name: Run Production Smoke Test Suite
        env:
          ENVIRONMENT: testing
          SECRET_KEY: ci-environment-testing-secret-key-32-chars-long
        run: |
          python scripts/production_smoke_test.py

  security-sast-and-audit:
    name: Security SAST, Dependency, Secret & Container Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit SAST Security Analysis
        working-directory: ./backend
        run: |
          bandit -r app -ll

      - name: Run pip-audit Dependency Vulnerability Scan
        working-directory: ./backend
        run: |
          pip-audit -r requirements.txt

      - name: Run Semgrep SAST Analysis
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten

      - name: Run Trivy Vulnerability Scanner (Repo & Configs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  frontend-tests-and-build:
    name: Frontend Vitest, Types & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests (Vitest)
        working-directory: ./frontend
        run: npm run test

      - name: Verify TypeScript & Frontend Production Build
        working-directory: ./frontend
        run: npm run build

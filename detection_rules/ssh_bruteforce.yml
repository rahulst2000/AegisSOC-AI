title: SSH Brute Force Authentication Attempts
id: AEGIS-SIG-SSH-BRUTEFORCE
status: stable
description: Detects repeated failed SSH authentication attempts originating from a single source IP within a short timeframe.
version: 1.1.0
logsource:
  service: ssh
  category: authentication
detection:
  selection_ssh_event:
    event_type: SSH_AUTH_FAILURE
  selection_ssh_source:
    event_type: AUTH_FAILURE
    source:
      - ssh
      - sshd
  timeframe: 5m
  condition: (selection_ssh_event or selection_ssh_source) | count() > 9
level: high
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001

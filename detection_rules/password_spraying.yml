title: Password Spraying Attempt
id: AEGIS-SIG-PASSWORD-SPRAYING
status: stable
description: Detects authentication failures against multiple distinct usernames from a single source IP within a sliding window.
version: 1.1.0
logsource:
  category: authentication
detection:
  selection:
    event_type:
      - AUTH_FAILURE
      - SSH_AUTH_FAILURE
  timeframe: 10m
  condition: selection | count(username) by source_ip > 4
level: high
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.003

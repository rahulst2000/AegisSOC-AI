services:
  postgres:
    image: postgres:16-alpine
    container_name: aegissoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegissoc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DEMO_PASSWORD=<configure locally>}
      POSTGRES_DB: ${POSTGRES_DB:-aegissoc_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegissoc_user} -d ${POSTGRES_DB:-aegissoc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegissoc-net

  redis:
    image: redis:7-alpine
    container_name: aegissoc-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegissoc-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegissoc-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-generate-with-openssl-rand-hex-32}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aegissoc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DEMO_PASSWORD=<configure locally>}
      POSTGRES_DB: ${POSTGRES_DB:-aegissoc_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aegissoc-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegissoc-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aegissoc-net

volumes:
  postgres_data:
  redis_data:

networks:
  aegissoc-net:
    driver: bridge
